<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishnu Mobiles – Download App</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.08);
    --accent: #4f8cff;
    --accent2: #a78bfa;
    --text: #f0f0f8;
    --muted: #7878a0;
    --success: #34d399;
    --error: #f87171;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,140,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,140,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.18; z-index: 0; pointer-events: none; }
  .blob1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
  .blob2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; }

  .container { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 1.5rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    backdrop-filter: blur(10px);
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-area { text-align: center; margin-bottom: 2rem; }

  .logo-img-wrap {
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 0.75rem; position: relative; width: 110px; height: 110px;
  }

  .logo-img-wrap::before {
    content: ''; position: absolute; inset: -6px; border-radius: 26px;
    background: conic-gradient(from 0deg, transparent 0deg, #4f8cff 60deg, #a78bfa 120deg,
      transparent 180deg, transparent 240deg, #4f8cff 300deg, #a78bfa 360deg);
    animation: spinRing 3s linear infinite; z-index: 0;
  }

  .logo-img-wrap::after {
    content: ''; position: absolute; inset: -3px; border-radius: 23px;
    background: var(--surface); z-index: 1;
  }

  @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .logo-img-wrap img {
    width: 90px; height: 90px; border-radius: 18px; object-fit: cover;
    position: relative; z-index: 5;
    animation: logoPulse 2.5s ease-in-out infinite, logoFloat 4s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,140,255,0), 0 0 0 0 rgba(167,139,250,0); }
    50%       { box-shadow: 0 0 18px 4px rgba(79,140,255,0.35), 0 0 30px 8px rgba(167,139,250,0.2); }
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-5px); }
  }

  .logo-particles { position: absolute; inset: -30px; z-index: 3; pointer-events: none; border-radius: 50%; width: 170px; height: 170px; }

  .logo-shimmer { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; z-index: 6; pointer-events: none; }
  .logo-shimmer::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.18) 50%, transparent 60%);
    animation: shimmerSweep 3s ease-in-out infinite;
  }
  @keyframes shimmerSweep { 0% { left: -100%; } 40%, 100% { left: 160%; } }

  h1 {
    font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 40%, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

  .step { display: none; }
  .step.active { display: block; animation: fadeUp 0.4s ease both; }

  label {
    display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
  }

  .input-wrap {
    display: flex; align-items: center; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,0.12); }

  .prefix {
    padding: 0 14px; font-size: 0.9rem; color: var(--muted); border-right: 1px solid var(--border);
    height: 48px; display: flex; align-items: center; font-family: 'Syne', sans-serif; font-weight: 600;
  }

  input[type="tel"], input[type="number"] {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 1rem; padding: 0 14px; height: 48px; font-family: 'DM Sans', sans-serif; letter-spacing: 0.05em;
  }

  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .btn {
    width: 100%; height: 50px; border: none; border-radius: 12px; font-family: 'Syne', sans-serif;
    font-size: 0.95rem; font-weight: 700; letter-spacing: 0.03em; cursor: pointer; transition: all 0.2s;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; margin-top: 1.25rem;
  }
  .btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .msg { font-size: 0.82rem; margin-top: 10px; text-align: center; min-height: 18px; transition: all 0.2s; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }
  .msg.info { color: var(--accent); }



  .download-icon {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(79,140,255,0.15));
    border: 1px solid rgba(52,211,153,0.3); border-radius: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 1rem; animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.15); }
    50% { box-shadow: 0 0 0 12px rgba(52,211,153,0); }
  }

  .app-info {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; display: flex; justify-content: space-between; margin: 1.25rem 0; font-size: 0.82rem;
  }

  .app-info-item { display: flex; flex-direction: column; gap: 3px; }
  .app-info-label { color: var(--muted); }
  .app-info-value { font-weight: 500; color: var(--text); font-family: 'Syne', sans-serif; }

  .btn-download {
    background: linear-gradient(135deg, #34d399, #059669); width: 100%; height: 52px; border: none;
    border-radius: 12px; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.2s; text-decoration: none;
  }
  .btn-download:hover { opacity: 0.88; transform: translateY(-1px); }

  .warning-note { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.5; }
  .back-btn {
    background: none; border: none; color: var(--muted); font-size: 0.8rem; cursor: pointer;
    display: flex; align-items: center; gap: 5px; padding: 0; margin-bottom: 1.25rem;
    font-family: 'DM Sans', sans-serif; transition: color 0.2s;
  }
  .back-btn:hover { color: var(--text); }


  /* ── Loading spinner ── */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Config banner ── */
  .config-banner {
    background: rgba(247,177,51,0.12); border: 1px solid rgba(247,177,51,0.3);
    border-radius: 10px; padding: 12px 14px; font-size: 0.78rem; color: #f7b133;
    margin-bottom: 1rem; line-height: 1.6; display: none;
  }
  .config-banner.show { display: block; }
  .config-banner code { background: rgba(247,177,51,0.15); padding: 1px 5px; border-radius: 4px; font-size: 0.76rem; }
</style>
</head>

<div class="container">
  <div class="card">

    <div class="logo-area">
      <div class="logo-img-wrap" id="logoWrap">
        <canvas class="logo-particles" id="particleCanvas" width="170" height="170"></canvas>

    <div class="step active" id="step1">

    <!-- Step 3: Download -->
    <div class="step" id="step3">
      <div style="text-align:center;">

            <path d="M8 32h24" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 style="font-size:1.3rem;">Download Ready</h1>
        <p class="subtitle" style="margin-top:6px;">Vishnu Mobiles App is ready for you</p>

<script>
// ── Helpers ────────────────────────────────────────
function setMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

function showStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? `<span class="spinner"></span> Please wait...`
    : label;
}

// ── Check number and go to download ────────────────
function checkNumber() {
  const phone = document.getElementById('phoneInput').value.trim();

  if (phone.length !== 10 || !/^\d{10}$/.test(phone)) {
    setMsg('msg1', 'Please enter a valid 10-digit number.', 'error');
    return;
  }

  if (phone !== ALLOWED_NUMBER) {
    setMsg('msg1', 'This number is not registered. Access denied.', 'error');
    return;
  }

  setLoading('sendBtn', true, 'Continue →');
  setMsg('msg1', '', '');

  setTimeout(() => {
    setLoading('sendBtn', false, 'Continue →');
    showStep(3);
  }, 600);
}

// ── Enter key ──────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (document.getElementById('step1').classList.contains('active')) checkNumber();
  }
});

// ── Particle animation ─────────────────────────────
(function() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  const colors = ['#4f8cff', '#a78bfa', '#34d399', '#fff'];
  const particles = Array.from({ length: 22 }, (_, i) => ({
    angle: (i / 22) * Math.PI * 2,
    radius: 52 + Math.random() * 18,
    size: 1.5 + Math.random() * 2.5,
    speed: 0.004 + Math.random() * 0.006,
    color: colors[Math.floor(Math.random() * colors.length)],
    opacity: 0.4 + Math.random() * 0.6,
    drift: Math.random() * Math.PI * 2,
    driftSpeed: 0.02 + Math.random() * 0.03,
  }));

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.angle += p.speed;
      p.drift += p.driftSpeed;
      const wobble = Math.sin(p.drift) * 6;
      const r = p.radius + wobble;
      const x = cx + Math.cos(p.angle) * r;
      const y = cy + Math.sin(p.angle) * r;
      const alpha = p.opacity * (0.6 + 0.4 * Math.sin(p.drift * 1.3));
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.fill();
      ctx.globalAlpha = 1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
